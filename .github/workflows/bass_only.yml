name: Bass Only

on:
  workflow_dispatch:

jobs:
  process-audio:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        [cite_start]uses: actions/checkout@v4 [cite: 1]

      - name: Set up Python
        [cite_start]uses: actions/setup-python@v5 [cite: 1]
        with:
          [cite_start]python-version: '3.10' [cite: 1]

      - name: Install FFmpeg
        run: |
          sudo apt-get update [cite: 2]
          sudo apt-get install -y ffmpeg [cite: 2]

      - name: Install Demucs and Dependencies
        run: |
          python -m pip install --upgrade pip [cite: 3]
          pip install torch torchaudio torchcodec --index-url https://download.pytorch.org/whl/cpu [cite: 3]
          pip install demucs [cite: 3]

      - name: Create Directories
        run: |
          mkdir -p uploads [cite: 4]
          mkdir -p output [cite: 4]

      - name: Run Script
        run: python main.py

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "bass-result-${{ github.run_number }}"
          name: "Bass Audio Result #${{ github.run_number }}"
          body: "File audio ini berisi track bass saja."
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
